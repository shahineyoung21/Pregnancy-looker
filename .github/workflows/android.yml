name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission
        run: chmod +x ./superG_Agent/android/gradlew || true

      - name: Build APK
        run: |
          cd superG_Agent/android
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found - project incomplete"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyBrotherMedical-debug-apk
          path: superG_Agent/android/app/build/outputs/apk/debug/*.apk
